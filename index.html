<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; background: #eff3ed; color: #18342c; font-family: "Malgun Gothic", sans-serif; }
    main { width: 100%; max-width: 660px; padding: 40px 32px; border: 1px solid #dce5da; border-radius: 28px; background: #fffefa; box-shadow: 0 16px 60px #18342c0d; }
    .tag { margin: 0 0 16px; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #53705d; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -2px; }
    .intro { margin: 0; color: #5d6b63; font-size: 15px; line-height: 1.8; }
    button { width: 100%; min-height: 88px; margin: 26px 0 12px; padding: 24px 16px; border: 0; border-radius: 14px; background: #245c45; color: white; font: inherit; font-size: clamp(22px, 5.5vw, 28px); line-height: 1.4; font-weight: bold; cursor: pointer; }
    button:hover { background: #194632; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #c58b13; outline-offset: 4px; }
    #status { min-height: 22px; margin: 0 0 16px; text-align: center; color: #5d6b63; font-size: 13px; }
    #results { display: grid; gap: 10px; }
    .empty { padding: 32px 12px; border: 1px dashed #ccd8cb; border-radius: 14px; text-align: center; line-height: 1.8; color: #67756c; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 14px; background: #f3f5ef; border-radius: 14px; }
    .label { font-size: 13px; white-space: nowrap; font-weight: bold; color: #526557; }
    .balls { display: flex; gap: 9px; }
    .ball { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 18px; font-weight: bold; box-shadow: inset 0 -3px 0 #00000014; }
    .yellow { background: #9a6a00; } .blue { background: #2677ad; } .red { background: #c34d48; } .gray { background: #697077; } .green { background: #40804a; }
    footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid #e5e9df; font-size: 12px; line-height: 1.8; color: #69746c; }
    @media (max-width: 480px) { main { padding: 28px 16px; } .row { padding: 14px 10px; gap: 8px; } .balls { gap: 5px; } .ball { width: clamp(28px, 8.2vw, 38px); height: clamp(28px, 8.2vw, 38px); font-size: 15px; } .label { font-size: 12px; } }
  </style>
</head>
<body>
  <main>
    <p class="tag">LOTTO 6 / 45</p>
    <h1>오늘의 로또 번호</h1>
    <p class="intro">버튼 한 번으로 추천 번호 5세트를 뽑아보세요.<br>각 세트마다 1~45 중 서로 다른 숫자 6개를 담습니다.</p>
    <button id="generate" type="button">추천 번호 5세트 뽑기</button>
    <p id="status" role="status" aria-live="polite">준비됐나요? 아래에 번호가 표시됩니다.</p>
    <section id="results" aria-label="추천 로또 번호">
      <div class="empty">아직 뽑은 번호가 없습니다.<br>위 버튼을 눌러주세요.</div>
    </section>
    <footer>번호는 무작위로 생성되며 당첨을 예측하거나 보장하지 않습니다.<br>한 세트 안에서는 숫자가 중복되지 않으며, 서로 다른 세트 사이에는 같은 숫자가 나올 수 있습니다.</footer>
  </main>
  <script>
    function randomBelow(max) {
      const buffer = new Uint32Array(1);
      const limit = 4294967296 - (4294967296 % max);
      do { crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
      return buffer[0] % max;
    }
    function makeSet() {
      const pool = Array.from({ length: 45 }, (_, i) => i + 1);
      for (let i = 0; i < 6; i++) {
        const j = i + randomBelow(45 - i);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, 6).sort((a, b) => a - b);
    }
    function makeFiveSets() {
      const sets = [];
      const seen = new Set();
      while (sets.length < 5) {
        const numbers = makeSet();
        const key = numbers.join(',');
        if (!seen.has(key)) { seen.add(key); sets.push(numbers); }
      }
      return sets;
    }
    let count = 0;
    document.getElementById('generate').addEventListener('click', () => {
      const results = document.getElementById('results');
      results.replaceChildren();
      makeFiveSets().forEach((numbers, index) => {
        const row = document.createElement('div');
        row.className = 'row';
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = `${index + 1}세트`;
        const balls = document.createElement('div');
        balls.className = 'balls';
        numbers.forEach(number => {
          const ball = document.createElement('span');
          ball.className = 'ball ' + ['yellow', 'blue', 'red', 'gray', 'green'][Math.floor((number - 1) / 10)];
          ball.textContent = number;
          balls.append(ball);
        });
        row.append(label, balls);
        results.append(row);
      });
      count++;
      document.getElementById('status').textContent = `${count}번째 추첨 완료 · 추천 번호 5세트가 표시되었습니다.`;
      document.getElementById('generate').textContent = '새 번호 5세트 다시 뽑기';
    });
  </script>
</body>
</html>
